name: Deploy to NOC-AI-DEPLOY-01 (staging test via personal repo)

on:
  push:
    branches: [feat/mcp-server]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy over SSH (server-side restricted key runs ci-deploy-staging.sh regardless of the command below)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /opt/manthan/scripts/ci-deploy.sh
          # A cold Docker build cache (first run, or after a prune) can take well over
          # the ssh-action default 10m command_timeout, which kills the SSH session and
          # reports "failure" even though the deploy script keeps running and succeeds
          # on the server. 30m covers a full cold rebuild of every service.
          command_timeout: 30m
