# Ador Manthan.AI — LibreChat (web UI) + GLM 5.2 (brain) + NOC read-only MCP server.
#
# Usage:
#   cd apps/ai-platform/librechat
#   cp .env.example .env        # then fill in secrets + GLM key + NOC read-only creds
#   docker compose up -d
#   open http://localhost/         (or http://<SERVER_HOST>/ for LAN access — nginx on :80)
#
# LibreChat requires a user account (true anonymous is unsupported); ALLOW_REGISTRATION=true
# in .env keeps signup open to everyone, which is the practical "open access".

# Pinned project name. Compose otherwise derives it from the directory, so this stack was
# project "chat" while it lived in chat/ and would silently become "librechat" after the
# move to apps/ai-platform/librechat/ - a new project means new, EMPTY volumes: every user
# account, chat history, agent definition and Qdrant KB vector orphaned in the old chat_*
# volumes with no error shown. Pinning the original name keeps the existing data attached
# no matter which directory the compose file is moved to next.
name: chat

services:
  api:
    # Stock upstream LibreChat PLUS the Knowledge Bases admin page (custom-image/).
    # The patches are applied on top of the exact upstream image rather than built from
    # LibreChat source, so this differs from production only by that patch set - see
    # custom-image/Dockerfile for the full rationale.
    #
    # Without this build block compose pulls bare ghcr.io/danny-avila/librechat:latest and
    # the stack comes up looking healthy but with no /knowledge-bases page and no
    # /api/knowledge-bases route - a silent feature loss, since nothing else references
    # custom-image/. BASE is passed explicitly so the base tag is visible here rather than
    # only in the Dockerfile's ARG default.
    build:
      context: ./custom-image
      args:
        BASE: ghcr.io/danny-avila/librechat:latest
    image: noc-librechat-kb:local
    container_name: noc-librechat
    # No published port: nginx (below) is the only browser-facing entry point, on :80.
    depends_on:
      - mongodb
      - meilisearch
      - mcp-server
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - CONFIG_PATH=/app/librechat.yaml
      # Browser-facing address, used to build share links. Derived from SERVER_HOST (.env)
      # so only that one value needs to change if the deployment moves host/domain.
      # The :-localhost default is load-bearing: with SERVER_HOST unset this resolves to the
      # bare string "http://", which LibreChat rejects at startup with "Failed to start
      # server: Invalid URL" - a crash loop whose message never mentions SERVER_HOST. The
      # default degrades to localhost-only instead of taking the whole stack down.
      - DOMAIN_CLIENT=http://${SERVER_HOST:-localhost}
      - DOMAIN_SERVER=http://${SERVER_HOST:-localhost}
      # Version shown in the LibreChat footer. APP_VERSION + GIT_SHA are injected by
      # apps/ai-platform/librechat/up.ps1 (or up.sh) from the VERSION file and `git rev-parse --short HEAD`,
      # so the footer always names the exact running build. A raw `docker compose up`
      # without the wrapper falls back to "dev (local)".
      - APP_TITLE=Ador Manthan.AI
      - "APP_VERSION=${APP_VERSION:-dev}"
      - "GIT_SHA=${GIT_SHA:-local}"
      - "CUSTOM_FOOTER=Ador Manthan.AI v${APP_VERSION:-dev} (${GIT_SHA:-local}) | [Changelog](https://github.com/Quench-EV-Charger/noc-mcp-agent/blob/main/CHANGELOG.md)"
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - librechat-images:/app/client/public/images
      - librechat-logs:/app/api/logs
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: noc-librechat-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: noc-librechat-meili
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili-data:/meili_data
    restart: unless-stopped

  # Read-only NOC MCP server (this repo). Exposes 153 GET endpoints as tools over HTTP.
  mcp-server:
    build: ../../../services/mcp/noc
    container_name: noc-mcp-server
    environment:
      - NOC_BASE_URL=${NOC_BASE_URL}
      - NOC_EMAIL=${NOC_EMAIL}
      - NOC_PASSWORD=${NOC_PASSWORD}
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8100
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  # Read-only RAG knowledge base over EV/SME docs (Qdrant + local BGE embedder).
  kb-mcp-server:
    build: ../../../services/mcp/kb
    container_name: kb-mcp-server
    depends_on:
      - qdrant
    environment:
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8106
      - QDRANT_URL=http://qdrant:6333
      - KNOWLEDGE_DIR=/knowledge
      # Department-facing plane: search + per-department write tools, and NO
      # kb_admin_* tool. KB administration lives on kb-admin-mcp-server below,
      # so a department agent cannot reach it even if its ACL were wrong.
      - KB_ROLE=dept
      - KB_REGISTRY_FILE=/knowledge/kb-registry.json
      - DEPARTMENTS_FILE=/config/departments.json
      # Re-read the registry on this interval, so a KB created on the admin
      # plane (a separate process) appears here without a restart.
      - RELOAD_INTERVAL_SECONDS=5
    volumes:
      # Writable (was :ro) so the departmental KB tools can upload and delete documents
      # from chat. The write path is still narrow: kb_upload_*/kb_delete_* bind their
      # target scope server-side and reject any filename containing a path separator,
      # so a caller cannot reach outside its own department folder.
      - ../../../knowledge:/knowledge
      # The control plane's department list, read-only. Mounting it is what keeps
      # departments out of this service's code: kb_admin_create_kb validates against
      # this file, so a fifth department needs no change here and no rebuild.
      - ./roles/departments.json:/config/departments.json:ro
      # The BGE embedding model (~450MB) is downloaded from HuggingFace on first
      # use. Without this cache every restart re-downloads it, which turns a
      # 5-second restart into a multi-minute outage of every KB search tool.
      - kb-model-cache:/root/.cache
    restart: unless-stopped

  # Super Admin control plane for knowledge bases. Same image, same registry file,
  # same Qdrant - only the role differs, so this is not a second RAG system: it is
  # the same one with a different tool surface.
  #
  # It exists as a separate endpoint rather than extra tools on kb-mcp-server so
  # that "a department head cannot create, re-assign or delete knowledge bases" is
  # a property of what is reachable from their agent, not only of LibreChat ACL.
  # Expose this server only to the Super Admin's agent.
  kb-admin-mcp-server:
    build: ../../../services/mcp/kb
    container_name: kb-admin-mcp-server
    depends_on:
      - qdrant
    environment:
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8109
      - QDRANT_URL=http://qdrant:6333
      - KNOWLEDGE_DIR=/knowledge
      - KB_ROLE=admin
      - KB_REGISTRY_FILE=/knowledge/kb-registry.json
      - DEPARTMENTS_FILE=/config/departments.json
    volumes:
      - ../../../knowledge:/knowledge
      - ./roles/departments.json:/config/departments.json:ro
    restart: unless-stopped

  # Read-only MCP server for Ecog's Atlassian Cloud Jira (vendor tracker).
  jira-mcp-server:
    build: ../../../services/mcp/jira
    container_name: jira-mcp-server
    environment:
      - JIRA_BASE_URL=${JIRA_BASE_URL}
      - JIRA_EMAIL=${JIRA_EMAIL}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8102
    restart: unless-stopped

  # Read-only MCP for ChargeZone's Atlassian Jira, HARD-scoped to the QCH (Quench) project.
  chargezone-jira-mcp-server:
    build: ../../../services/mcp/chargezone
    container_name: chargezone-jira-mcp-server
    environment:
      - CZ_JIRA_BASE_URL=${CZ_JIRA_BASE_URL}
      - CZ_JIRA_EMAIL=${CZ_JIRA_EMAIL}
      - CZ_JIRA_API_TOKEN=${CZ_JIRA_API_TOKEN}
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8105
    restart: unless-stopped

  # Read-only MCP for Ecog's Jira Service Desk (customer API, cookie/Playwright auth).
  ecog-sd-mcp-server:
    build: ../../../services/mcp/ecog-sd
    container_name: ecog-sd-mcp-server
    environment:
      - ECOG_BASE_URL=${ECOG_BASE_URL:-https://ecog.atlassian.net}
      - ECOG_EMAIL=${ECOG_EMAIL}
      - ECOG_PASSWORD=${ECOG_PASSWORD}
      - ECOG_COOKIE=${ECOG_COOKIE:-}
      - ECOG_HEADLESS=${ECOG_HEADLESS:-true}
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8104
    volumes:
      - ecog-sd-cookies:/data
    restart: unless-stopped

  # Document-generation MCP (this repo, services/mcp/docgen/). Turns tabular/report data into
  # downloadable files (.xlsx now; .docx/.pdf next). Internal-only, like the other MCP servers.
  docgen-mcp-server:
    build: ../../../services/mcp/docgen
    container_name: docgen-mcp-server
    # No published port: nginx (below) proxies /files/ to this container on the internal
    # network. P0-1/P0-3 (reverse proxy, no raw MCP ports) are satisfied by this.
    environment:
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8103
      # Base URL baked into every download link, resolved by the USER'S BROWSER. NOTE: no
      # /files suffix here — docgen_mcp/server.py's _deliver() already appends
      # /files/{file_id}/{filename} itself; adding it here would double it up.
      - DOCGEN_PUBLIC_BASE_URL=http://${SERVER_HOST:-localhost}
      - DOCGEN_DATA_DIR=/data/files
    # Persist generated files so download links survive container restarts/rebuilds.
    volumes:
      - docgen-files:/data
    restart: unless-stopped

  # Platform Intelligence MCP (this repo, services/mcp/platform/). Read-only introspection
  # of the repository itself (health, structure, git state) — not an external backend, so
  # it needs the repo mounted rather than a base URL. Internal-only, like the other MCP
  # servers; the mount is read-only so this container cannot modify the repository.
  platform-mcp-server:
    build: ../../../services/mcp/platform
    container_name: platform-mcp-server
    environment:
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8107
      - REPO_ROOT=/workspace
    volumes:
      - ../../..:/workspace:ro
    restart: unless-stopped

  # LibreChat Admin Panel — roles/groups + permissions GUI. Talks to the LibreChat API only
  # (not Mongo). GUI at http://<SERVER_HOST>:3091; the first-registered LibreChat user is
  # admin. Needs ADMIN_PANEL_SESSION_SECRET in .env (init-env.ps1 generates it).
  # Published on its own port rather than proxied under a subpath: this is a prebuilt Vite
  # SPA with no confirmed support for a non-root base path, so /admin/ risked breaking its
  # own JS/CSS asset loading. SECURITY: this again exposes an admin surface on a raw port —
  # in production it MUST sit behind auth/IP-allowlisted TLS termination (P0-1), same
  # requirement as before, just not handled by nginx for this one service.
  admin-panel:
    image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
    container_name: noc-librechat-admin
    depends_on:
      - api
    environment:
      - PORT=3000
      - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
      - API_SERVER_URL=http://api:3080   # server-to-server (in-network)
      - VITE_API_BASE_URL=http://${SERVER_HOST:-localhost}   # browser-facing LibreChat URL, via nginx
      - SESSION_COOKIE_SECURE=false      # local http; set true behind TLS in prod
    ports:
      - "3091:3000"
    restart: unless-stopped

  # Reverse proxy: fronts LibreChat (/) and generated file downloads (/files/) on port 80.
  # admin-panel is NOT routed here (see its own comment above) — it keeps its own port.
  nginx:
    image: nginx:alpine
    container_name: noc-nginx
    depends_on:
      - api
      - docgen-mcp-server
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  mongo-data:
  meili-data:
  librechat-images:
  librechat-logs:
  ecog-sd-cookies:
  docgen-files:
  qdrant-data:
  kb-model-cache:
