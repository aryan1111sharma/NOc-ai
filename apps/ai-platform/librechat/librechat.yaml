version: 1.2.1
cache: true

# UI branding
interface:
  customWelcome: "Welcome to Ador Manthan.AI v0.13.1 - ask about chargers, tickets, and alarms."

# Which agent a NEW chat starts on. Without this, LibreChat carries over whatever agent was
# used last, which is why sessions kept landing back on the GLM agent after it ran out of
# z.ai balance.
#
#   prioritize: true   -> new chats open on the `default: true` spec below.
#   enforce:    false  -> users can still switch agent/endpoint freely. Do NOT set this true:
#                         it locks everyone to this list, and any agent not listed becomes
#                         unreachable.
#
# Listing an agent here does not grant access to it - the agent ACL (aclentries) is still
# enforced server-side, so an unauthorised pick fails at the API, not silently.
modelSpecs:
  prioritize: true
  enforce: false
  list:
    - name: "noc-engineer-kimi"
      label: "NOC Engineer"
      default: true
      description: "NOC engineer assistant on Kimi (kimi-for-coding). Default."
      preset:
        endpoint: "agents"
        agent_id: "agent_kimi26NOCEngineerV1"

# Allow LibreChat to reach the internal MCP server containers (SSRF protection allowlist).
mcpSettings:
  allowedAddresses:
    - "mcp-server:8100"
    - "jira-mcp-server:8102"
    - "docgen-mcp-server:8103"
    - "ecog-sd-mcp-server:8104"
    - "chargezone-jira-mcp-server:8105"
    - "kb-mcp-server:8106"
    - "platform-mcp-server:8107"
    - "kb-admin-mcp-server:8109"

endpoints:
  custom:
    # GLM (Zhipu / z.ai) ??? OpenAI-compatible API. Key comes from apps/ai-platform/librechat/.env (GLM_API_KEY).
    - name: "GLM"
      apiKey: "${GLM_API_KEY}"
      # GLM Coding Plan endpoint (OpenAI-compatible). NOT the general /api/paas/v4 endpoint,
      # which is pay-as-you-go and returns 429 "insufficient balance". Verified: this URL
      # returns 200 and GLM-5.2 emits tool calls correctly.
      baseURL: "https://api.z.ai/api/coding/paas/v4"
      models:
        # Text models (NOC Q&A + tools): glm-5.x, glm-4.x. "-turbo"/"-air" = faster/lighter.
        # Vision models (image analysis): glm-4.6v, glm-4.5v.
        default:
          - "glm-5.2"
          - "glm-4.7"
          - "glm-5.1"
          - "glm-5"
          - "glm-5-turbo"
          - "glm-4.6"
          - "glm-4.5"
          - "glm-4.5-air"
          - "glm-4.6v"
          - "glm-4.5v"
        fetch: false
      titleConvo: true
      titleModel: "glm-4.6"
      modelDisplayLabel: "GLM (NOC Assistant)"

    # Kimi (Moonshot AI) - OpenAI-compatible API. Key comes from apps/ai-platform/librechat/.env (KIMI_API_KEY).
    # Added alongside GLM, not replacing it: GLM resumes working the moment its z.ai
    # balance is topped up, and the two can be A/B'd on the same NOC questions.
    - name: "Kimi"
      apiKey: "${KIMI_API_KEY}"
      # "Kimi For Coding" subscription endpoint - this is what an sk-kimi-* key binds to.
      # NOT https://api.moonshot.ai/v1 (pay-as-you-go platform) and NOT api.moonshot.cn
      # (mainland platform). All three are separate accounts with non-interchangeable
      # keys; an sk-kimi-* key returns 401 "Invalid Authentication" on the other two.
      # Same trap as the GLM coding-plan endpoint above.
      baseURL: "https://api.kimi.com/coding/v1"
      models:
        # These are the canonical ids from GET /coding/v1/models. Verified 2026-08-06:
        # all four return finish_reason "tool_calls" correctly. Measured round-trip on a
        # single-tool prompt: highspeed 1.0s, kimi-for-coding 2.8s, k3 7.1s, k3-256k 24.5s.
        #
        # kimi-for-coding (K2.7 Coding, 262k) is the default - the best latency/capability
        # balance for multi-hop NOC tool chains, where per-turn latency compounds. Our
        # ~43k-token tool block leaves ample room in 262k, so k3's 1M window is not needed.
        #
        # Do NOT use kimi-k2.6 / kimi-k3 / kimi-k2.5 / kimi-k2.7-code here: they are
        # accepted and echoed back, but absent from /models, so they are undocumented
        # aliases that can disappear without notice.
        default:
          - "kimi-for-coding"
          - "kimi-for-coding-highspeed"
          - "k3"
          - "k3-256k"
        fetch: false
      titleConvo: true
      # Titles are throwaway one-liners - use the fastest model.
      titleModel: "kimi-for-coding-highspeed"
      modelDisplayLabel: "Kimi (NOC Assistant)"

# NOC read-only MCP server (this repo, services/mcp/noc/). Its 153 GET tools become available
# to LibreChat Agents. Build a LibreChat Agent using the GLM model + this server's tools.
mcpServers:
  noc:
    type: streamable-http
    url: "http://mcp-server:8100/mcp"
    # timeout for tool calls (ms); NOC reports/telemetry can be slow.
    timeout: 60000
  jira:
    type: streamable-http
    url: "http://jira-mcp-server:8102/mcp"
    # Jira Cloud REST is fast; a modest timeout is fine.
    timeout: 60000
  ecog_sd:
    type: streamable-http
    url: "http://ecog-sd-mcp-server:8104/mcp"
    timeout: 60000
  # Read-only ChargeZone Jira, scoped to the QCH (Quench) project. Jira Cloud REST is fast.
  chargezone:
    type: streamable-http
    url: "http://chargezone-jira-mcp-server:8105/mcp"
    timeout: 60000
  # Document generation (services/mcp/docgen/). Exposes create_excel (??? .xlsx) as a tool;
  # GLM calls it after fetching data to return a downloadable file.
  docgen:
    type: streamable-http
    url: "http://docgen-mcp-server:8103/mcp"
    timeout: 60000
  kb:
    type: streamable-http
    url: "http://kb-mcp-server:8106/mcp"
    timeout: 60000
  # Super Admin control plane for knowledge bases (same service, KB_ROLE=admin).
  # Exposes only kb_admin_* - creating, assigning, listing and deleting KBs - and
  # deliberately no kb_search_*. Share this server with the Super Admin's agent
  # ONLY: any agent that can reach it can re-assign any department's KB.
  #
  # Department agents use `kb` above, which has no administration tool at all, so
  # a department head has nothing to call even if they build their own agent.
  kb_admin:
    type: streamable-http
    url: "http://kb-admin-mcp-server:8109/mcp"
    timeout: 60000
  # Platform Intelligence (services/mcp/platform/). Read-only introspection of this
  # repository itself (health, structure, git state) ??? not an external backend.
  platform:
    type: streamable-http
    url: "http://platform-mcp-server:8107/mcp"
    timeout: 60000


