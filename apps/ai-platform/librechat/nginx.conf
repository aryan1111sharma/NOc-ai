# Reverse proxy for the Ador Manthan.AI stack. Fronts LibreChat and generated-file downloads
# on port 80, so those two services don't need their own published port (P0-1/P0-3).
#
# admin-panel is deliberately NOT routed here - it's a prebuilt Vite SPA with no confirmed
# support for a non-root base path, so proxying it under /admin/ risked breaking its own
# JS/CSS asset loading. It keeps its own published port (3091) instead; see
# docker-compose.yml's admin-panel service comment.
#
# Routes:
#   /        -> LibreChat (api:3080)             - web UI + API, needs WebSocket/SSE support
#   /files/  -> docgen-mcp-server (:8103)        - generated Excel/Word/PDF downloads

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Standard nginx idiom for proxying both WebSocket upgrades and normal HTTP through the
    # same location: only sends "Connection: upgrade" when the client actually requested an
    # upgrade ($http_upgrade is non-empty); otherwise sends "close" so plain requests aren't
    # given a bogus upgrade header.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS server. Required for the runtime re-resolution below: without an
    # explicit resolver, nginx cannot look a name up after config load and refuses to start
    # when proxy_pass uses a variable. ipv6=off because these containers are IPv4-only and
    # the AAAA lookup just adds a failing query per resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        # Uploads pass through here before reaching LibreChat, and nginx's
        # default body limit is 1 MB. LibreChat itself allows 512 MB, so
        # anything larger was rejected with a 413 by nginx and never reached
        # the app - no entry in its log, and the browser just showed a failed
        # upload. Spreadsheets are the common casualty: the data-feed exports
        # in this project run 1.3-12 MB.
        #
        # 64m sits comfortably above the 25 MB knowledge-base upload cap
        # (KB_MAX_UPLOAD_MB) and ordinary chat attachments, without letting
        # someone push LibreChat's full 512 MB through the proxy.
        client_max_body_size 64m;

        # WHY THE UPSTREAMS GO THROUGH VARIABLES
        #
        # With a literal hostname (proxy_pass http://api:3080), nginx resolves the name once
        # at config-load time and caches that IP for the worker's lifetime. Containers get a
        # new IP whenever they are recreated - which `up.ps1` does on every build - so nginx
        # keeps connecting to an address nothing is listening on and every request fails with
        # 502, until nginx itself is restarted.
        #
        # Observed exactly that: nginx started 08:42, docgen was recreated 10:37 and moved
        # from 172.18.0.6 to 172.18.0.4, and downloads returned
        #   connect() failed (111: Connection refused) ... upstream: "http://172.18.0.6:8103/..."
        # while the same file fetched fine directly from the container.
        #
        # Putting the host in a variable defers resolution to request time, so a recreated
        # container is picked up within the resolver's `valid` window with no nginx restart.
        # Note: when proxy_pass uses a variable and specifies no URI, nginx forwards the
        # original request URI unchanged - which is what both routes need.

        # LibreChat web UI + API. Chat responses stream over SSE/WebSocket, so this needs
        # HTTP/1.1 keep-alive, the Upgrade/Connection headers, and buffering disabled --
        # without proxy_buffering off, nginx holds the whole response before forwarding it,
        # which breaks the token-by-token "typing" effect.
        location / {
            set $librechat_upstream api;
            proxy_pass http://$librechat_upstream:3080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Generated-file downloads. No path rewrite: docgen_mcp/server.py registers its route
        # at exactly /files/{file_id}/{filename}, so the full incoming path must be forwarded
        # unchanged. This never collides with LibreChat's own /api/files/ routes - nginx
        # selects the longest matching prefix, and /api/files/ does not start with /files/.
        location /files/ {
            set $docgen_upstream docgen-mcp-server;
            proxy_pass http://$docgen_upstream:8103;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
