# Reverse proxy for the Ador Manthan.AI stack. Fronts LibreChat and generated-file downloads
# on port 80, so those two services don't need their own published port (P0-1/P0-3).
#
# admin-panel is deliberately NOT routed here - it's a prebuilt Vite SPA with no confirmed
# support for a non-root base path, so proxying it under /admin/ risked breaking its own
# JS/CSS asset loading. It keeps its own published port (3091) instead; see
# docker-compose.yml's admin-panel service comment.
#
# Routes:
#   /        -> LibreChat (api:3080)             - web UI + API, needs WebSocket/SSE support
#   /files/  -> docgen-mcp-server (:8103)        - generated Excel/Word/PDF downloads

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Standard nginx idiom for proxying both WebSocket upgrades and normal HTTP through the
    # same location: only sends "Connection: upgrade" when the client actually requested an
    # upgrade ($http_upgrade is non-empty); otherwise sends "close" so plain requests aren't
    # given a bogus upgrade header.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upload ceiling for the whole proxy. nginx defaults to 1m, which silently made this the
    # tightest limit in the stack and capped KB document uploads far below what the backend
    # accepts: the KB API sends binary files base64-encoded inside a JSON body, and base64
    # inflates by 4/3, so a bare 1m here rejected any PDF over roughly 750KB.
    #
    # The failure was worse than a low limit. nginx answers with an HTML error page, while
    # every application-level rejection answers with JSON {"message": ...}; the Knowledge
    # Bases UI surfaces only that message, so an oversized upload produced an opaque failure
    # with no stated reason instead of "File too large".
    #
    # 160m is deliberately ABOVE every application limit. Keeping the proxy looser than the
    # app means the app is always the component that enforces the limit, so the client keeps
    # getting a readable JSON error rather than nginx's HTML page.
    #
    # Sized from the KB upload ceiling, which is the largest body the stack accepts: 100 MB
    # of file (kb_mcp/manage.py MAX_UPLOAD_BYTES) travels base64-encoded inside a JSON body,
    # and base64 inflates by 4/3, so ~133.4 MB reaches this proxy. apply-patches.sh mounts
    # express.json({ limit: '150mb' }) for /api/knowledge-bases alone, and this sits above
    # that. Every other route keeps LibreChat's own 3mb parser, so raising this does not
    # raise any application's limit -- it only moves an oversized body's refusal from nginx
    # to express, which is where the readable error comes from.
    #
    # services/mcp/kb/tests/test_upload_limits.py asserts that ordering, so changing this
    # number without the others fails the test suite.
    client_max_body_size 160m;

    # Docker's embedded DNS server. Required for the runtime re-resolution below: without an
    # explicit resolver, nginx cannot look a name up after config load and refuses to start
    # when proxy_pass uses a variable. ipv6=off because these containers are IPv4-only and
    # the AAAA lookup just adds a failing query per resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Plain HTTP: only the ACME renewal path is served here; everything else
    # redirects to HTTPS so old http:// links still land on the secure page.
    # Also listens on 8080, which used to be admin-panel's own directly-published
    # HTTP port (docker-compose.yml) - now it's just a bounce to the HTTPS admin site.
    server {
        listen 80;
        listen 8080;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        ssl_certificate /etc/letsencrypt/live/ai.manthanquench.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ai.manthanquench.online/privkey.pem;

        # WHY THE UPSTREAMS GO THROUGH VARIABLES
        #
        # With a literal hostname (proxy_pass http://api:3080), nginx resolves the name once
        # at config-load time and caches that IP for the worker's lifetime. Containers get a
        # new IP whenever they are recreated - which `up.ps1` does on every build - so nginx
        # keeps connecting to an address nothing is listening on and every request fails with
        # 502, until nginx itself is restarted.
        #
        # Observed exactly that: nginx started 08:42, docgen was recreated 10:37 and moved
        # from 172.18.0.6 to 172.18.0.4, and downloads returned
        #   connect() failed (111: Connection refused) ... upstream: "http://172.18.0.6:8103/..."
        # while the same file fetched fine directly from the container.
        #
        # Putting the host in a variable defers resolution to request time, so a recreated
        # container is picked up within the resolver's `valid` window with no nginx restart.
        # Note: when proxy_pass uses a variable and specifies no URI, nginx forwards the
        # original request URI unchanged - which is what both routes need.

        # LibreChat web UI + API. Chat responses stream over SSE/WebSocket, so this needs
        # HTTP/1.1 keep-alive, the Upgrade/Connection headers, and buffering disabled --
        # without proxy_buffering off, nginx holds the whole response before forwarding it,
        # which breaks the token-by-token "typing" effect.
        location / {
            set $librechat_upstream api;
            proxy_pass http://$librechat_upstream:3080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;

            # A KB document upload is synchronous all the way down: the request does not
            # answer until kb-mcp has parsed, chunked, embedded and upserted the file. At
            # the 100 MB ceiling that is minutes of CPU-bound embedding, and nginx's default
            # 60s proxy_read_timeout would 504 a request whose work was still progressing --
            # reporting a failure for a document that does get indexed.
            #
            # Only relevant when the upstream is silent, so this is harmless for the chat
            # routes: SSE token streams send data continuously and never approach it.
            # Matches KB_MCP_TIMEOUT_MS in api/server/routes/knowledgeBases.js, so the app
            # gives up before the proxy does and the client gets the app's error.
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }

        # Generated-file downloads. No path rewrite: docgen_mcp/server.py registers its route
        # at exactly /files/{file_id}/{filename}, so the full incoming path must be forwarded
        # unchanged. This never collides with LibreChat's own /api/files/ routes - nginx
        # selects the longest matching prefix, and /api/files/ does not start with /files/.
        location /files/ {
            set $docgen_upstream docgen-mcp-server;
            proxy_pass http://$docgen_upstream:8103;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS for the Admin Panel (separate app/container, own subdomain).
    server {
        listen 443 ssl;
        server_name admin.manthanquench.online;

        ssl_certificate /etc/letsencrypt/live/ai.manthanquench.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ai.manthanquench.online/privkey.pem;

        location / {
            set $adminpanel_upstream admin-panel;
            proxy_pass http://$adminpanel_upstream:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
