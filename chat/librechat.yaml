# LibreChat configuration ??? GLM 5.2 endpoint + NOC read-only MCP server.
# Docs: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.2.1
cache: true

# UI branding. The footer (version + commit id) is set via CUSTOM_FOOTER in
# docker-compose.yml ??? that's the mechanism this LibreChat version renders;
# interface.customFooter is ignored. This welcome greets the new-chat screen
# with the release version; the version token is bumped by scripts/bump-version.
interface:
  customWelcome: "Welcome to Ador Manthan.AI v0.10.0 - ask about chargers, tickets, and alarms. Chat through a GLM Agent with the noc tools enabled."

# Allow LibreChat to reach the internal MCP server containers (SSRF protection allowlist).
mcpSettings:
  allowedAddresses:
    - "mcp-server:8100"
    - "cms-mcp-server:8101"
    - "jira-mcp-server:8102"
    - "docgen-mcp-server:8103"
    - "ecog-sd-mcp-server:8104"
    - "chargezone-jira-mcp-server:8105"
    - "kb-mcp-server:8106"

endpoints:
  custom:
    # GLM (Zhipu / z.ai) ??? OpenAI-compatible API. Key comes from chat/.env (GLM_API_KEY).
    - name: "GLM"
      apiKey: "${GLM_API_KEY}"
      # GLM Coding Plan endpoint (OpenAI-compatible). NOT the general /api/paas/v4 endpoint,
      # which is pay-as-you-go and returns 429 "insufficient balance". Verified: this URL
      # returns 200 and GLM-5.2 emits tool calls correctly.
      baseURL: "https://api.z.ai/api/coding/paas/v4"
      models:
        # Text models (NOC Q&A + tools): glm-5.x, glm-4.x. "-turbo"/"-air" = faster/lighter.
        # Vision models (image analysis): glm-4.6v, glm-4.5v.
        default:
          - "glm-5.2"
          - "glm-4.7"
          - "glm-5.1"
          - "glm-5"
          - "glm-5-turbo"
          - "glm-4.6"
          - "glm-4.5"
          - "glm-4.5-air"
          - "glm-4.6v"
          - "glm-4.5v"
        fetch: false
      titleConvo: true
      titleModel: "glm-4.6"
      modelDisplayLabel: "GLM (NOC Assistant)"

    # Kimi (Moonshot AI) - OpenAI-compatible API. Key comes from chat/.env (KIMI_API_KEY).
    # Added alongside GLM, not replacing it: GLM resumes working the moment its z.ai
    # balance is topped up, and the two can be A/B'd on the same NOC questions.
    - name: "Kimi"
      apiKey: "${KIMI_API_KEY}"
      # International endpoint. api.moonshot.cn is the SEPARATE mainland platform with its
      # own account and its own key - the two are not interchangeable.
      baseURL: "https://api.moonshot.ai/v1"
      models:
        # k2.6 is the default: 262k context, automatic context caching (covers tool
        # definitions), native tool calling. Our ~43k-token tool block fits with room to
        # spare, so k3's 1M window buys nothing while costing ~3x input / ~4x output.
        # k3 is listed so a hard reasoning question can switch per-conversation.
        # moonshot-v1-* is deliberately omitted - that series is sunset on 2026-08-31.
        default:
          - "kimi-k2.6"
          - "kimi-k3"
          - "kimi-k2.5"
          - "kimi-k2.7-code"
        fetch: false
      titleConvo: true
      titleModel: "kimi-k2.6"
      modelDisplayLabel: "Kimi (NOC Assistant)"

# NOC read-only MCP server (this repo, mcp-server/). Its 153 GET tools become available
# to LibreChat Agents. Build a LibreChat Agent using the GLM model + this server's tools.
mcpServers:
  noc:
    type: streamable-http
    url: "http://mcp-server:8100/mcp"
    # timeout for tool calls (ms); NOC reports/telemetry can be slow.
    timeout: 60000
  cms:
    type: streamable-http
    url: "http://cms-mcp-server:8101/mcp"
    # Must exceed the device-command poll budget (device_poll_timeout, 90s): a live
    # charger can take ~44s to answer under load, and a small fleet query runs several
    # of those. At the old 90s this equalled the poll budget, so any full-budget query
    # was killed by this client before the tool could return. 5 min gives a single
    # charger and a modest fleet call real headroom. Large sweeps use a background
    # script, not chat -- see scripts/firmware-inventory (both-NOC firmware export).
    timeout: 300000
  jira:
    type: streamable-http
    url: "http://jira-mcp-server:8102/mcp"
    # Jira Cloud REST is fast; a modest timeout is fine.
    timeout: 60000
  ecog_sd:
    type: streamable-http
    url: "http://ecog-sd-mcp-server:8104/mcp"
    timeout: 60000
  # Read-only ChargeZone Jira, scoped to the QCH (Quench) project. Jira Cloud REST is fast.
  chargezone:
    type: streamable-http
    url: "http://chargezone-jira-mcp-server:8105/mcp"
    timeout: 60000
  # Document generation (docgen-mcp-server/). Exposes create_excel (??? .xlsx) as a tool;
  # GLM calls it after fetching data to return a downloadable file.
  docgen:
    type: streamable-http
    url: "http://docgen-mcp-server:8103/mcp"
    timeout: 60000
  kb:
    type: streamable-http
    url: "http://kb-mcp-server:8106/mcp"
    timeout: 60000
