# Reverse proxy for the Ador Manthan.AI stack. Fronts LibreChat and generated-file downloads
# on port 80, so those two services don't need their own published port (P0-1/P0-3).
#
# admin-panel is deliberately NOT routed here — it's a prebuilt Vite SPA with no confirmed
# support for a non-root base path, so proxying it under /admin/ risked breaking its own
# JS/CSS asset loading. It keeps its own published port (3091) instead; see
# chat/docker-compose.yml's admin-panel service comment.
#
# Routes:
#   /        -> LibreChat (api:3080)            — web UI + API, needs WebSocket/SSE support
#   /files/  -> docgen-mcp-server (:8103)        — generated Excel/Word/PDF downloads

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Standard nginx idiom for proxying both WebSocket upgrades and normal HTTP through the
    # same location: only sends "Connection: upgrade" when the client actually requested an
    # upgrade ($http_upgrade is non-empty); otherwise sends "close" so plain requests aren't
    # given a bogus upgrade header.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # LibreChat web UI + API. Chat responses stream over SSE/WebSocket, so this needs
        # HTTP/1.1 keep-alive, the Upgrade/Connection headers, and buffering disabled --
        # without proxy_buffering off, nginx holds the whole response before forwarding it,
        # which breaks the token-by-token "typing" effect.
        location / {
            proxy_pass http://api:3080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Generated-file downloads. No path rewrite: docgen_mcp/server.py registers its route
        # at exactly /files/{file_id}/{filename}, so the full incoming path must be forwarded
        # unchanged (proxy_pass with no URI after the host:port preserves it).
        location /files/ {
            proxy_pass http://docgen-mcp-server:8103;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
