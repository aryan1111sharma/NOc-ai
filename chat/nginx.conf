# Reverse proxy for the Ador Manthan.AI stack. This is the ONLY container with a published
# port (80) — every other service (LibreChat, docgen, admin-panel) is reached through here,
# so no individual service port needs to be exposed to the host (P0-1/P0-3).
#
# Routes:
#   /        -> LibreChat (api:3080)            — web UI + API, needs WebSocket/SSE support
#   /files/  -> docgen-mcp-server (:8103)        — generated Excel/Word/PDF downloads
#   /admin/  -> admin-panel (:3000)              — roles/groups GUI

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # LibreChat web UI + API. Chat responses stream over SSE/WebSocket, so this needs
        # HTTP/1.1 keep-alive, the Upgrade/Connection headers, and buffering disabled --
        # without proxy_buffering off, nginx holds the whole response before forwarding it,
        # which breaks the token-by-token "typing" effect.
        location / {
            proxy_pass http://api:3080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Generated-file downloads. No path rewrite: docgen_mcp/server.py registers its route
        # at exactly /files/{file_id}/{filename}, so the full incoming path must be forwarded
        # unchanged (proxy_pass with no URI after the host:port preserves it).
        location /files/ {
            proxy_pass http://docgen-mcp-server:8103;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # LibreChat Admin Panel.
        location /admin/ {
            proxy_pass http://admin-panel:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
